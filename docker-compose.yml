name: treecify-lab
services:
  api:
    build:
      context: .
    image: treecify-lab:1.0
    restart: "no"
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET de laboratorio en .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      DB_PATH: /data/links.db
      UPLOAD_DIR: /data/uploads
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - lab-data:/data
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
volumes:
  lab-data:
